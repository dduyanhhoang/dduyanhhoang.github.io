<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ddah app icon: the letter phi, flat export (UI/UX SPEC-001, Icon).
       Three layers of solid shapes, as Apple's layered icons expect:
       background (rounded square), middle (phi's ring), foreground (phi's
       stem, crossing over the ring). The two glyph layers use different
       tints so the depth survives the flat export. Light and dark variants
       follow the system. Drawn as paths, so no font is needed.
       Source of truth for apple-touch-icon.png too. -->
  <style>
    .bg-top { stop-color: #2b8cff; } .bg-bottom { stop-color: #0058d0; }
    .ring { fill: #bfdcff; }
    .stem { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg-top { stop-color: #3a3a3c; } .bg-bottom { stop-color: #1c1c1e; }
      .ring { fill: #4da3ff; }
      .stem { fill: #e8f2ff; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop class="bg-top" offset="0"/>
      <stop class="bg-bottom" offset="1"/>
    </linearGradient>
  </defs>
  <g id="background"><rect width="64" height="64" rx="14" fill="url(#bg)"/></g>
  <g id="middle"><path class="ring" fill-rule="evenodd" d="M16 32a16 12.5 0 1 0 32 0a16 12.5 0 1 0-32 0ZM21.5 32a10.5 7.5 0 1 0 21 0a10.5 7.5 0 1 0-21 0Z"/></g>
  <g id="foreground"><rect class="stem" x="29" y="9" width="6" height="46" rx="3"/></g>
</svg>
