<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ddah</title>
  <meta name="description" content="A terminal. Type help." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="/src/site/terminal.css" />
  <script type="module" src="/src/site/terminal.js"></script>
</head>
<body>
  <main class="term" id="term">
    <h1 class="sr-only">ddah terminal. Type help for commands.</h1>

    <!-- Page registry: every page is a directory in the shell. Add a page
         here and ls, cd and Tab pick it up. Without JS this list is the
         whole page. -->
    <nav aria-label="Pages" id="pages-nav">
      <ul class="ls" id="pages">
        <li><a href="/home/">home/</a></li>
        <li><a href="/links/">links/</a></li>
        <li><a href="/research/">research/</a></li>
      </ul>
    </nav>

    <div id="log" role="log" aria-live="polite"></div>

    <form class="prompt" id="prompt" hidden autocomplete="off">
      <label for="cmd" class="ps1"><span class="user">guest@ddah</span>:<span class="cwd">/</span>$<span class="sr-only"> command</span></label>
      <input id="cmd" name="cmd" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" autofocus />
    </form>
  </main>
</body>
</html>
